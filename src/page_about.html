<include src="layout.html">
  <template name="seo">
    <meta name="description" th:content="${theme.config.profile.bio}" />
    <link rel="canonical" th:href="${singlePage.status.permalink}" />
    <meta property="og:site_name" th:content="${site.title}" />
    <meta property="og:type" content="profile" />
    <meta property="og:title" th:content="${singlePage.spec.title}" />
    <meta property="og:description" th:content="${theme.config.profile.bio ?: site.subtitle}" />
    <meta property="og:url" th:content="${singlePage.status.permalink}" />
    <meta
      th:if="${theme.config.profile.avatar}"
      property="og:image"
      th:content="${theme.config.profile.avatar}"
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" th:content="${singlePage.spec.title}" />
    <meta name="twitter:description" th:content="${theme.config.profile.bio ?: site.subtitle}" />
    <script type="application/ld+json" th:inline="javascript">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": /*[[${theme.config.profile.display_name}]]*/ "",
        "url": /*[[${site.url}]]*/ "",
        "image": /*[[${theme.config.profile.avatar}]]*/ "",
        "description": /*[[${theme.config.profile.bio}]]*/ ""
      }
    </script>
    <script type="application/ld+json" th:inline="javascript">
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "首页", "item": /*[[${site.url}]]*/ "" },
          { "@type": "ListItem", "position": 2, "name": /*[[${singlePage.spec.title}]]*/ "" }
        ]
      }
    </script>
  </template>
  <template name="head">
    <title th:text="|${singlePage.spec.title} - ${site.title}|">About</title>
  </template>

  <div id="about-content" class="about-page">
    <div class="about-layout">
      <!-- Left Sidebar -->
      <aside class="about-sidebar-panel">
        <img
          class="about-avatar-large"
          th:if="${theme.config.profile.avatar}"
          th:src="${theme.config.profile.avatar}"
          alt="头像"
          width="150"
          height="150"
          fetchpriority="high"
        />
        <h2 class="about-sidebar-name" th:text="${theme.config.profile.display_name ?: 'Author'}">
          Aria Chen
        </h2>
        <p class="about-sidebar-bio" th:text="${theme.config.profile.bio}">
          Designer-engineer · part-time photographer · full-time wanderer.
        </p>

        <!-- Stats -->
        <div
          class="about-stats"
          th:with="galleryAlbums=${photoGalleryFinder != null ? photoGalleryFinder.listAlbums() : null}"
        >
          <div class="about-stat-item">
            <span class="about-stat-value" th:text="${postFinder.list({page: 1, size: 1}).total}"
              >0</span
            >
            <span class="about-stat-label">文章</span>
          </div>
          <div class="about-stat-item">
            <span
              class="about-stat-value"
              th:text="${momentFinder != null ? momentFinder.listAll().size() : 0}"
              >0</span
            >
            <span class="about-stat-label">瞬间</span>
          </div>
          <div class="about-stat-item">
            <span
              class="about-stat-value"
              th:text="${galleryAlbums != null and !#lists.isEmpty(galleryAlbums) ? (#aggregates.sum(galleryAlbums.![photoCount ?: 0]) ?: 0) : 0}"
              >0</span
            >
            <span class="about-stat-label">照片</span>
          </div>
        </div>

        <div class="about-social-grid">

            th:if="${theme.config.social.github}"
            th:href="${theme.config.social.github}"
            target="_blank"
            rel="noopener"
            class="about-social-btn"
            title="GitHub"
          >

              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"

      </aside>

      <!-- Right Content -->
      <div class="about-content">
        <!-- My Story -->
        <section class="about-card">
          <h3 class="about-card-title">关于我</h3>
          <div
            class="about-story-text"
            th:if="${singlePage.content != null and singlePage.content.content != null and !#strings.isEmpty(singlePage.content.content)}"
            th:utext="${singlePage.content.content}"
          ></div>
          <div
            class="about-story-text"
            th:if="${singlePage.content == null or singlePage.content.content == null or #strings.isEmpty(singlePage.content.content)}"
          >
            <p th:text="${theme.config.profile.about_text}"></p>
          </div>

          <!-- Interest Tags -->
          <div class="about-interests-blue" th:if="${theme.config.profile.interests}">
            <th:block th:each="tag : ${#strings.arraySplit(theme.config.profile.interests, ',')}">
              <span class="about-interest-blue" th:text="${#strings.trim(tag)}"></span>
            </th:block>
          </div>

          <!-- Timeline (repeater format: each item is a Map with year + event) -->
          <th:block
            th:if="${theme.config.profile.milestone_list != null and #lists.isEmpty(theme.config.profile.milestone_list) == false}"
          >
            <p class="about-timeline-label">里程碑</p>
            <ol class="about-timeline">
              <th:block th:each="item : ${theme.config.profile.milestone_list}">
                <li class="about-timeline-item">
                  <p class="about-timeline-year" th:text="${item.year}">Year</p>
                  <p class="about-timeline-text" th:text="${item.event}">Description</p>
                </li>
              </th:block>
            </ol>
          </th:block>
        </section>

        <!-- Skills & Hobbies -->
        <section
          class="about-card"
          th:if="${theme.config.profile.radar_items != null and !#lists.isEmpty(theme.config.profile.radar_items)}"
        >
          <h3 class="about-card-title">技能与爱好</h3>
          <p
            class="about-card-subtitle"
            th:text="${theme.config.profile.skills_subtitle ?: '一份随性的自我评估，随心情更新。'}"
          >
            一份随性的自我评估，随心情更新。
          </p>
          <div class="about-radar-container">
            <svg viewBox="0 0 200 200" class="about-radar-svg" preserveAspectRatio="xMidYMid meet">
              <!-- Grid hexagons (cx=100 cy=79 R=59) -->
              <polygon
                class="radar-grid"
                points="100,20 151.1,49.5 151.1,108.5 100,138 48.9,108.5 48.9,49.5"
                fill="none"
                stroke-width="0.5"
              />
              <polygon
                class="radar-grid"
                points="100,39.7 134.1,59.3 134.1,98.7 100,118.3 65.9,98.7 65.9,59.3"
                fill="none"
                stroke-width="0.5"
              />
              <polygon
                class="radar-grid"
                points="100,59.3 117,69.2 117,88.8 100,98.7 83,88.8 83,69.2"
                fill="none"
                stroke-width="0.5"
              />
              <!-- Axis lines (center to each vertex) -->
              <line class="radar-grid" x1="100" y1="79" x2="100" y2="20" stroke-width="0.5" />
              <line class="radar-grid" x1="100" y1="79" x2="151.1" y2="49.5" stroke-width="0.5" />
              <line class="radar-grid" x1="100" y1="79" x2="151.1" y2="108.5" stroke-width="0.5" />
              <line class="radar-grid" x1="100" y1="79" x2="100" y2="138" stroke-width="0.5" />
              <line class="radar-grid" x1="100" y1="79" x2="48.9" y2="108.5" stroke-width="0.5" />
              <line class="radar-grid" x1="100" y1="79" x2="48.9" y2="49.5" stroke-width="0.5" />
              <!-- Data polygon -->
              <polygon
                id="radar-data-polygon"
                class="radar-data"
                fill-opacity="0.28"
                stroke-width="1.5"
              />
              <!-- Labels -->
              <text
                class="radar-label"
                x="100"
                y="12"
                text-anchor="middle"
                font-size="9"
                th:text="${theme.config.profile.radar_items.size() > 0 ? theme.config.profile.radar_items[0].label : ''}"
              >
                摄影
              </text>
              <text
                class="radar-label"
                x="159"
                y="49.5"
                text-anchor="start"
                font-size="9"
                th:text="${theme.config.profile.radar_items.size() > 1 ? theme.config.profile.radar_items[1].label : ''}"
              >
                修图
              </text>
              <text
                class="radar-label"
                x="159"
                y="112"
                text-anchor="start"
                font-size="9"
                th:text="${theme.config.profile.radar_items.size() > 2 ? theme.config.profile.radar_items[2].label : ''}"
              >
                编程
              </text>
              <text
                class="radar-label"
                x="100"
                y="153"
                text-anchor="middle"
                font-size="9"
                th:text="${theme.config.profile.radar_items.size() > 3 ? theme.config.profile.radar_items[3].label : ''}"
              >
                写作
              </text>
              <text
                class="radar-label"
                x="41"
                y="112"
                text-anchor="end"
                font-size="9"
                th:text="${theme.config.profile.radar_items.size() > 4 ? theme.config.profile.radar_items[4].label : ''}"
              >
                咖啡
              </text>
              <text
                class="radar-label"
                x="41"
                y="49.5"
                text-anchor="end"
                font-size="9"
                th:text="${theme.config.profile.radar_items.size() > 5 ? theme.config.profile.radar_items[5].label : ''}"
              >
                音乐
              </text>
            </svg>
            <!-- Hidden data for JS radar computation -->
            <span id="radar-values" style="display: none"
              ><th:block th:each="item,stat : ${theme.config.profile.radar_items}"
                ><th:block th:text="${item.value}">0</th:block
                ><th:block th:if="${!stat.last}">,</th:block></th:block
              ></span
            >
          </div>
        </section>

        <!-- Current Gear (reads from gear page data, in-use only) -->
        <th:block
          th:if="${theme.config.gear.gear_list != null and !#lists.isEmpty(theme.config.gear.gear_list)}"
        >
          <section class="about-card">
            <div class="about-card-header">
              <h3 class="about-card-title">当前装备</h3>
              <a th:href="@{/gear}" class="about-card-link">
                查看完整装备柜
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M5 12h14" />
                  <path d="m12 5 7 7-7 7" />
                </svg>
              </a>
            </div>
            <ul class="about-gear-list">
              <th:block
                th:each="device : ${theme.config.gear.gear_list}"
                th:if="${device.status != 'retired'}"
              >
                <li class="about-gear-item">
                  <div class="about-gear-thumb">
                    <img th:src="${device.image ?: theme.config.profile.avatar}" alt="" width="64" height="64" loading="lazy" />
                  </div>
                  <div class="about-gear-info">
                    <p class="about-gear-name" th:text="${device.name}">Device</p>
                    <p class="about-gear-review" th:text="${device.review}">Review</p>
                  </div>
                </li>
              </th:block>
            </ul>
          </section>
        </th:block>

        <!-- Changelog -->
        <section
          class="about-card"
          th:if="${theme.config.profile.changelog != null and !#lists.isEmpty(theme.config.profile.changelog)}"
        >
          <h3 class="about-card-title">更新记录</h3>
          <ol class="about-timeline about-timeline-compact">
            <th:block th:each="item : ${theme.config.profile.changelog}">
              <li class="about-timeline-item">
                <p class="about-timeline-year" th:text="${item.date}">日期</p>
                <p class="about-timeline-text" th:text="${item.content}">内容</p>
              </li>
            </th:block>
          </ol>
        </section>
      </div>
    </div>
  </div>

  <script type="module" src="./js/about.ts"></script>
</include>
