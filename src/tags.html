<include src="layout.html">
  <template name="seo">
    <th:block th:replace="~{partials/seo :: meta('tags')}"></th:block>
  </template>
  <template name="head">
    <title th:text="|Tags - ${site.title}|">标签</title>
  </template>

  <div class="tags-page">
    <div class="section-header" style="margin-bottom: 40px">
      <div>
        <h1 class="section-title" style="font-size: 32px">标签</h1>
        <p class="section-subtitle">通过标签探索话题。</p>
      </div>
    </div>

    <div class="tags-cloud" th:if="${tags != null}">
      <a th:each="tag : ${tags}" th:href="@{${tag.status.permalink}}" class="tag-pill">
        <span class="tag-pill-name" th:text="${tag.spec.displayName}"></span>
        <span class="tag-pill-count" th:text="${tag.postCount ?: 0}">0</span>
      </a>
    </div>
  </div>
</include>
