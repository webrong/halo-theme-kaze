<include src="shop-layout.html">
  <template name="seo">
    <th:block th:replace="~{seo :: meta('shop')}"></th:block>
  </template>
  <template name="head">
    <title th:text="|${product.title} - ${site.title}|">商品详情</title>
    <style>
      #searchToggle {
        display: none !important;
      }
      #themeToggle {
        display: none !important;
      }
    </style>
    <th:block th:replace="~{shop/modules/style}"></th:block>
    <th:block th:replace="~{shop/modules/script}"></th:block>
  </template>

  <div class="shop-page">
    <th:block th:replace="~{shop/modules/product}"></th:block>
  </div>
</include>
