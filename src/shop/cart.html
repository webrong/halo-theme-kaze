<include src="shop-layout.html">
  <template name="seo">
    <th:block th:replace="~{seo :: meta('shop')}"></th:block>
  </template>
  <template name="head">
    <title th:text="|购物车 - ${site.title}|">购物车</title>
    <style>
      #searchToggle {
        display: none !important;
      }
      #themeToggle {
        display: none !important;
      }
    </style>
    <th:block th:replace="~{shop/modules/style}"></th:block>
    <th:block th:replace="~{shop/modules/script}"></th:block>
  </template>

  <div class="shop-page">
    <th:block th:replace="~{shop/modules/cart}"></th:block>
  </div>
</include>
